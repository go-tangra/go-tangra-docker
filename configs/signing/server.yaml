server:
  grpc:
    addr: "0.0.0.0:10400"
    timeout: 30s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: false
      enable_validate: true
      enable_metadata: true

data:
  database:
    driver: postgres
    source: "postgres://postgres:*Abcd123456@postgres:5432/gwa?sslmode=disable"
    migrate: true
    max_idle_connections: 5
    max_open_connections: 20
    connection_max_lifetime: 3600s
  redis:
    network: tcp
    addr: "redis:6379"
    password: "*Abcd123456"
    read_timeout: 1s
    write_timeout: 1s
  storage:
    endpoint: "rustfs:9000"
    bucket: "signing"
    access_key: "rustfsadmin"
    secret_key: "rustfsadmin"
    use_ssl: false

signing:
  local_cert:
    enabled: true
    validity_years: 2
    default_org: "GoTangra Signing"
    auto_create_tenant_ca: true
    pin_min_length: 4
    pin_max_length: 32
