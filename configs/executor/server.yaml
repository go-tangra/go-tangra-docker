server:
  grpc:
    # Reassigned 9800 → 10700 to avoid collision with asterisk which
    # already owns 9800 in this compose stack.
    addr: "0.0.0.0:10700"
    timeout: 30s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: false
      enable_validate: true
      enable_metadata: true
