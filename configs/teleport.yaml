# teleport (feature 001-teleport-cluster-management). Development values:
# plaintext Valkey and database connections, file-backed cluster credentials
# and insecure enrolment are named opt-outs the service prints as warnings and
# refuses when env is "production"; prod-init.sh rewrites them into
# prod/configs/teleport.yaml. teleport seals nothing (no KEK) and stores no
# files in the object store.
service_name: teleport
trust_domain: example.org
env: dev
# The module obtains its own mesh SVID by ENROLLING with lcm over the network
# (app.Build injects the provider when mesh_enroll.enabled); identity is provided.
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: https://gateway:8443/api/lcm/v1/enroll
  lcm_grpc: lcm:9945
  tenant_id: "00000000-0000-0000-0000-000000000001"
  token_file: /tokens/teleport.token
  state_file: /state/svid.json
  insecure: true
authz: { source: file, path: deploy/policy.yaml }
server: { grpc_addr: 0.0.0.0:9925, http_addr: 0.0.0.0:9926 }
admin: { addr: 127.0.0.1:9870 }
discovery:
  static:
    gateway: ["gateway:9643"]
    auth: ["auth:9543"]
    warden: ["warden:9843"]
    scheduler: ["scheduler:9905"]
    notification: ["notification:9943"]
db:
  dsn: postgres://teleport_app:dev@timescaledb:5432/teleport?sslmode=disable
  migrate_dsn: postgres://postgres:dev@timescaledb:5432/teleport?sslmode=disable
  max_conns: 16
valkey: { addresses: ["valkey:6379"], username: teleport, password: dev, allow_plaintext: true }
events: { enabled: true }
# Cluster credentials live in warden. warden has no write RPC yet (research
# D11), so development stores newly registered credentials as files.
secrets:
  warden_service: warden
  allow_file: true
  file_dir: /state/credentials
gateway: { service: gateway, issuer: https://localhost:8443 }
teleport:
  # Private, loopback and link-local proxy addresses are refused except here
  # (logged at start). DEV: only the optional teleport-ce test cluster on the
  # teleport-lab network (docker compose --profile teleport-ce).
  allowed_private_networks: ["172.31.251.2/32"]
  allowed_ports: [443, 3080]
  call_timeout_seconds: 10
  max_message_bytes: 4194304
  max_concurrent_per_cluster: 4
  cache_ttl_seconds: 15
  probe_timeout_seconds: 5
thresholds:
  credential_warn_days: 7
  unreachable_after_failures: 3
  offline_minutes: 15
  deprovision_grace_days: 7
limits_teleport: { max_request_bytes: 1048576, max_upload_bytes: 65536, max_page_size: 200 }
task_scheduler: { enabled: true, service: scheduler }
