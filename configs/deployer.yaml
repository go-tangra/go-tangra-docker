service_name: deployer
trust_domain: example.org
env: dev
# deployer obtains its SVID by ENROLLING with lcm over the network (via the
# gateway edge); app.Build injects the enroll provider, so identity is provided.
identity:
  provider: provided
enroll:
  enabled: true
  enroll_url: https://gateway:8443/api/lcm/v1/enroll
  lcm_grpc: lcm:9945
  tenant_id: "00000000-0000-0000-0000-000000000001"
  token_file: /tokens/deployer.token
  state_file: /state/svid.json
  insecure: true
authz: { source: file, path: deploy/policy.yaml }
server: { grpc_addr: 0.0.0.0:9945, http_addr: 0.0.0.0:9946 }
admin: { addr: 127.0.0.1:9690 }
discovery:
  static:
    gateway: ["gateway:9643"]
    auth: ["auth:9543"]
    lcm: ["lcm:9945"]
limits: { max_request_bytes: 16842752 }
limits_deployer: { backup_max_bytes: 16777216, config_max_bytes: 16384, filter_max_length: 256 }
db:
  dsn: postgres://deployer_app:dev@timescaledb:5432/deployer?sslmode=disable
  migrate_dsn: postgres://postgres:dev@timescaledb:5432/deployer?sslmode=disable
valkey: { addresses: ["valkey:6379"], username: deployer, password: dev, allow_plaintext: true }
kek: { source: file, path: deploy/kek.dev }
jobs: { workers: 5, interval_seconds: 5, lease_seconds: 300, max_retries: 3, retry_delay_seconds: 60, backoff_multiplier: 2.0, job_timeout_seconds: 300, cleanup_days: 30 }
events: { enabled: true }
gateway: { service: gateway, issuer: https://localhost:8443 }
lcm: { service: lcm }
