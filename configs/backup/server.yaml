server:
  grpc:
    addr: 0.0.0.0:10100
    timeout: 300s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_tracing: false
      enable_validate: true
      enable_metadata: true

data:
  database:
    driver: "postgres"
    source: "postgres://postgres:*Abcd123456@postgres:5432/gwa?sslmode=disable"
    migrate: true
    max_idle: 10
    max_open: 100
    max_lifetime: 3600s
  redis:
    network: tcp
    addr: "redis:6379"
    password: "*Abcd123456"
    read_timeout: 1s
    write_timeout: 1s
