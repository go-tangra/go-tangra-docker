service_name: asset
trust_domain: example.org
env: dev
# asset obtains its own mesh SVID by ENROLLING with lcm over the network
# (app.Build injects the provider when mesh_enroll.enabled); identity is provided.
identity:
  provider: provided
mesh_enroll:
  enabled: true
  enroll_url: https://gateway:8443/api/lcm/v1/enroll
  lcm_grpc: lcm:9945
  tenant_id: "00000000-0000-0000-0000-000000000001"
  token_file: /tokens/asset.token
  state_file: /state/svid.json
  insecure: true
authz: { source: file, path: deploy/policy.yaml }
server: { grpc_addr: 0.0.0.0:9995, http_addr: 0.0.0.0:9996 }
admin: { addr: 127.0.0.1:9830 }
discovery:
  static:
    gateway: ["gateway:9643"]
    auth: ["auth:9543"]
    lcm: ["lcm:9945"]
    inventory: ["inventory:9975"]
limits: { max_request_bytes: 33554432 }
limits_asset: { max_request_bytes: 1048576, max_backup_bytes: 33554432 }
db:
  dsn: postgres://asset_app:dev@timescaledb:5432/asset?sslmode=disable
  migrate_dsn: postgres://postgres:dev@timescaledb:5432/asset?sslmode=disable
valkey: { addresses: ["valkey:6379"], username: asset, password: dev, allow_plaintext: true }
kek: { source: file, path: deploy/kek.dev }
# Photos + documents land in RustFS (dev: plaintext, shared dev credentials, own bucket).
object_store:
  endpoint: rustfs:9000
  bucket: asset
  region: us-east-1
  use_ssl: false
  access_key: paperless
  secret_key: paperless-dev-secret
  presign_ttl_seconds: 900
inventory: { service: inventory }
scheduler: { interval_seconds: 300, warranty_soon_days: 30, license_soon_days: 30, insurance_soon_days: 30 }
uploads: { max_size_bytes: 20971520 }
events: { enabled: true }
gateway: { service: gateway, issuer: https://localhost:8443 }
