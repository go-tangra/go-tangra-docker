# Copy of deploy/policy.yaml from the feature-027 go-tangra-notification image (the policy
# built into the image; adds `scheduler-execute` (feature 026) and svc/signing in
# `modules-send` (feature 027)). prod-init.sh writes it to
# prod/policies/ with TRUST_DOMAIN in place of example.org; the production
# overlay mounts that over the image's copy.
# Freya service-to-service policy for notification: the gateway forwards
# browser traffic and probes health; other modules call notification.v1
# directly (contracts/manifest.md). lcm sends the expiring-certificates digest
# (feature 026; Notifier/Send with template keys lcm.* only, enforced by
# notification); signing sends its signing.* system templates (feature 027).
version: notification-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["notification"]
    operations: ["*"]
    effect: allow
  - id: modules-send
    from: ["spiffe://example.org/svc/warden", "spiffe://example.org/svc/auth", "spiffe://example.org/svc/lcm", "spiffe://example.org/svc/signing"]
    to: ["notification"]
    operations: ["/notification.v1.Notifier/Send", "/notification.v1.Notifier/SendTest", "/notification.v1.Events/Publish"]
    effect: allow
  - id: scheduler-execute
    # The scheduler (feature 026) runs notification's registered task types; the
    # executor server re-checks that the verified peer is the scheduler.
    from: ["spiffe://example.org/svc/scheduler"]
    to: ["notification"]
    operations: ["/scheduler.v1.TaskExecutor/ExecuteTask"]
    effect: allow
