# Copy of deploy/policy.yaml from ghcr.io/go-tangra/go-tangra-notification:4.3.0 (the policy built
# into the image). prod-init.sh writes it to prod/policies/ with TRUST_DOMAIN in
# place of example.org; the production overlay mounts that over the image's copy.
# Freya service-to-service policy for notification: the gateway forwards
# browser traffic and probes health; other modules call notification.v1
# directly (contracts/manifest.md).
version: notification-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["notification"]
    operations: ["*"]
    effect: allow
  - id: modules-send
    from: ["spiffe://example.org/svc/warden", "spiffe://example.org/svc/auth"]
    to: ["notification"]
    operations: ["/notification.v1.Notifier/Send", "/notification.v1.Notifier/SendTest", "/notification.v1.Events/Publish"]
    effect: allow
