# Copy of deploy/policy.yaml from the feature-027 go-tangra-auth image (the policy
# built into the image; adds `signing-directory` with /auth.v1.Profiles/Contacts;
# the feature-028 release adds `hr-directory`).
# prod-init.sh writes it to prod/policies/ with TRUST_DOMAIN in place of
# example.org; the production overlay mounts that over the image's copy.
# Freya service-to-service policy for the auth service: platform services may
# read keys, revocations and ask for decisions; only registered services may
# register permissions (tighten per deployment).
version: auth-dev-1
rules:
  - id: services-verify
    from: ["spiffe://example.org/svc/*"]
    to: ["auth"]
    operations: ["/auth.v1.Keys/List", "/auth.v1.Sessions/RevokedSince", "/auth.v1.Sessions/Watch", "/auth.v1.Authorization/Check", "/auth.v1.Authorization/BatchCheck", "/grpc.health.v1.Health/Check"]
    effect: allow
  - id: services-register
    from: ["spiffe://example.org/svc/*"]
    to: ["auth"]
    operations: ["/auth.v1.Authorization/RegisterPermissions", "/auth.v1.Sessions/Introspect"]
    effect: allow
  - id: notification-directory
    from: ["spiffe://example.org/svc/notification"]
    to: ["auth"]
    operations: ["/auth.v1.Profiles/Lookup", "/auth.v1.Profiles/ListMembers"]
    effect: allow
  - id: asset-directory
    from: ["spiffe://example.org/svc/asset"]
    to: ["auth"]
    operations: ["/auth.v1.Profiles/Lookup", "/auth.v1.Profiles/ListMembers"]
    effect: allow
  - id: ticket-directory
    from: ["spiffe://example.org/svc/ticket"]
    to: ["auth"]
    operations: ["/auth.v1.Profiles/Lookup", "/auth.v1.Profiles/ListMembers"]
    effect: allow
  - id: signing-directory
    # signing (feature 027) resolves signers and their contact addresses.
    from: ["spiffe://example.org/svc/signing"]
    to: ["auth"]
    operations: ["/auth.v1.Profiles/Lookup", "/auth.v1.Profiles/ListMembers", "/auth.v1.Profiles/Contacts"]
    effect: allow
  - id: hr-directory
    # hr (feature 028) lists tenant members and resolves their contact addresses.
    from: ["spiffe://example.org/svc/hr"]
    to: ["auth"]
    operations: ["/auth.v1.Profiles/Lookup", "/auth.v1.Profiles/ListMembers", "/auth.v1.Profiles/Contacts"]
    effect: allow
  - id: gateway-exchange
    from: ["spiffe://example.org/svc/gateway"]
    to: ["auth"]
    operations: ["/auth.v1.Sessions/Exchange", "/auth.v1.Sessions/MintToken"]
    effect: allow
  - id: lcm-enrollment-verify
    from: ["spiffe://example.org/svc/lcm"]
    to: ["auth"]
    operations: ["/auth.v1.Enrollment/VerifyEnrollmentToken"]
    effect: allow
  - id: gateway-enrollment-mint
    from: ["spiffe://example.org/svc/gateway"]
    to: ["auth"]
    operations: ["/auth.v1.Enrollment/MintEnrollmentToken"]
    effect: allow
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["auth"]
    operations: ["*"]
    effect: allow
